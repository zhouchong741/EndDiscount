name: 5-Minute Fast Scrape and Deploy

on:
  schedule:
    # 每5分钟运行一次
    - cron: '*/5 * * * *'
  workflow_dispatch: # 允许手动触发

concurrency:
  group: endclothing-sale-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Run Fast Scraper
        run: python -u scrape_fast.py

      - name: Commit and Push changes
        if: env.DATA_CHANGED == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.js endclothing_70off.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update data [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Setup Pages
        if: env.DATA_CHANGED == 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: env.DATA_CHANGED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: env.DATA_CHANGED == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify DingTalk
        if: success() && env.DATA_CHANGED == 'true'
        run: |
          curl 'https://oapi.dingtalk.com/robot/send?access_token=5945ce9476563718586b7134fbe53ff8e501c6d1425c71c67b5a365d27f7995b' \
            -H 'Content-Type: application/json' \
            -d '{
              "msgtype": "markdown",
              "markdown": {
                "title": "End70 自动更新成功",
                "text": "### End70 数据已更新 🚀\n\n极速爬虫任务完成，页面已部署。\n\n**Men**: ${{ env.MEN_PRODUCT_COUNT }}（${{ env.MEN_CHANGE_DESC }}）\n**Women**: ${{ env.WOMEN_PRODUCT_COUNT }}（${{ env.WOMEN_CHANGE_DESC }}）\n**总计**: ${{ env.PRODUCT_COUNT }}（${{ env.PRODUCT_CHANGE_DESC }}）\n\n[点击访问](${{ steps.deployment.outputs.page_url }})"
              }
            }'
